name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # The installer resolves its target as ${XDG_CONFIG_HOME:-$HOME}/.foundry.
      # GitHub runners SET XDG_CONFIG_HOME, so it lands in ~/.config/.foundry
      # rather than ~/.foundry. It honours FOUNDRY_DIR, so pin that explicitly.
      # It also only appends to a shell profile CI never sources, hence the
      # absolute paths and the manual $GITHUB_PATH entry.
      - name: Install Monad Foundry
        env:
          FOUNDRY_DIR: ${{ github.workspace }}/.foundry
        run: |
          set -euo pipefail
          curl -L https://foundry.category.xyz | bash
          test -x "$FOUNDRY_DIR/bin/foundryup" \
            || { echo "foundryup missing"; ls -laR "$FOUNDRY_DIR" 2>/dev/null || true; exit 1; }
          "$FOUNDRY_DIR/bin/foundryup" --network monad
          echo "$FOUNDRY_DIR/bin" >> "$GITHUB_PATH"

      - name: Versions
        run: forge --version && cast --version

      - name: forge build
        working-directory: contracts
        run: forge build --sizes

      - name: forge test
        working-directory: contracts
        run: forge test -vv

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: typecheck
        run: npx tsc --noEmit

      - name: lint
        run: npm run lint

      # No API keys in CI. The build must succeed without them — the app is
      # designed to error at request time, not fail to build.
      - name: build
        run: npm run build
