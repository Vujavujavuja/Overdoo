name: Feature or change
description: Propose something new, or a change to how something works
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is hard, missing, or wrong today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like to happen
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - contracts
        - web (UI)
        - flight data / providers
        - EU261 rules engine
        - docs
        - CI / tooling
        - not sure
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
